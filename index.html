<!-- index.html -->
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyber Resume Generator</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #05050d; --card-bg: rgba(13, 13, 26, 0.9); --neon-cyan: #00f3ff; --neon-pink: #ff007f; --neon-purple: #b000ff; --text-main: #f0f6fc; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%); color: var(--text-main); padding: 40px 15px; min-height: 100vh; }
        .form-container { max-width: 850px; background: var(--card-bg); padding: 40px; margin: 0 auto; border-radius: 16px; border: 2px solid var(--neon-cyan); box-shadow: 0 0 25px rgba(0, 243, 255, 0.25); backdrop-filter: blur(10px); }
        .header-title { text-align: center; margin-bottom: 35px; }
        .header-title h2 { font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; color: #fff; text-transform: uppercase; text-shadow: 0 0 10px var(--neon-cyan); }
        .header-title p { font-size: 15px; color: var(--neon-pink); margin-top: 8px; text-shadow: 0 0 5px var(--neon-pink); }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .full-width { grid-column: span 2; }
        .section-header { grid-column: span 2; font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: var(--neon-pink); text-transform: uppercase; border-bottom: 2px solid var(--neon-pink); margin-top: 15px; padding-bottom: 6px; }
        label { font-weight: 600; margin-bottom: 6px; display: block; color: var(--neon-cyan); font-size: 14px; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px 14px; border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; font-size: 15px; color: #fff; background-color: rgba(5, 5, 13, 0.8); transition: all 0.3s ease; font-family: 'Rajdhani', sans-serif; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.5); }
        textarea { resize: vertical; height: 90px; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); border: none; color: #fff; font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; border-radius: 8px; margin-top: 30px; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); text-transform: uppercase; }
        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(255, 0, 127, 0.8); background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); }
        .nav-link { display: inline-block; text-align: center; width: 100%; margin-top: 20px; color: var(--neon-cyan); text-decoration: none; font-weight: 700; font-size: 15px; }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } .full-width, .section-header { grid-column: span 1; } }
    </style>
</head>
<body>
<div class="form-container">
    <div class="header-title">
        <h2>Cyberpunk Resume Studio</h2>
        <p>Ultra Neon Professional Resume Generator</p>
    </div>
    <form id="resumeForm">
        <div class="form-grid">
            <div class="section-header">1. Personal Info</div>
            <div><label>Full Name *</label><input type="text" id="name" placeholder="e.g. Harshit Kumar" required></div>
            <div><label>Mobile No *</label><input type="text" id="mobile" placeholder="e.g. 9129191898" required></div>
            <div><label>Email ID</label><input type="email" id="email" placeholder="e.g. harshit@example.com"></div>
            <div><label>Profile Photo</label><input type="file" id="photoInput" accept="image/*"></div>
            <div class="full-width"><label>Address *</label><input type="text" id="address" placeholder="e.g. village Ghatauli post Milkipur" required></div>

            <div class="section-header">2. Career Objective</div>
            <div class="full-width"><label>Objective Statement:</label><textarea id="objective">To work in a progressive organization where I can put my effort at the level of my best and enhance my skills and knowledge and achieve high career growth through a continuous learning process and looking for a dynamic and vibrant work.</textarea></div>

            <div class="section-header">3. Educational Qualification</div>
            <div class="full-width"><label>Qualifications & Passing Years:</label><textarea id="education" placeholder="10th passed from UP Board in 2020, 12th passed from UP Board in 2022, Government ITI from COPA Trade in 2024"></textarea></div>

            <div class="section-header">4. Skills & Capabilities</div>
            <div class="full-width"><label>Technical Qualification:</label><textarea id="technical" placeholder="Advance diploma in computer application, Tally erp9 & tally prime with ADV. Excel, 'O' Level"></textarea></div>
            <div class="full-width"><label>Key Skills:</label><textarea id="skills" placeholder="HTML, CSS, JavaScript, CorelDRAW, Accounting"></textarea></div>
            <div class="full-width"><label>Projects & Certifications:</label><textarea id="projects" placeholder="NIELIT O Level Certification, Web Development"></textarea></div>
            <div class="full-width"><label>Work Experience:</label><textarea id="experience" placeholder="1 year in GST Office"></textarea></div>

            <div class="section-header">5. Additional Details</div>
            <div><label>Father's Name</label><input type="text" id="fatherName" placeholder="Dr. Manoj Kumar"></div>
            <div><label>Mother's Name</label><input type="text" id="motherName" placeholder="Sneh Lata"></div>
            <div><label>Date of Birth / Born On</label><input type="text" id="dob" placeholder="13 Sep 2006 (13/09/2006)"></div>
            <div><label>Gender</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>
            <div><label>Marital Status</label><input type="text" id="maritalStatus" value="un-married"></div>
            <div><label>Religion</label><input type="text" id="religion" value="Hindu"></div>
            <div><label>Nationality</label><input type="text" id="nationality" value="Indian"></div>
            <div><label>Languages Known</label><input type="text" id="languages" value="Hindi , English ."></div>
            <div class="full-width"><label>Hobbies / Interests</label><input type="text" id="interest" value="teaching , reading Books, Accounting."></div>
        </div>
        <button type="submit" class="submit-btn">⚡ Save & Launch Resume</button>
    </form>
    <a href="data.html" class="nav-link">Go to Neon Gallery (data.html) →</a>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed: ', err));
        });
    }

    const DEFAULT_OBJECTIVE = "To work in a progressive organization where I can put my effort at the level of my best and enhance my skills and knowledge and achieve high career growth through a continuous learning process and looking for a dynamic and vibrant work.";

    document.getElementById('resumeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const photoInput = document.getElementById('photoInput');
        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) { saveData(e.target.result); };
            reader.readAsDataURL(photoInput.files[0]);
        } else {
            saveData('');
        }
    });

    function cleanStringList(val) {
        if (!val) return "";
        return val.split(/[\n,]+/).map(item => item.trim()).filter(Boolean).join('. ');
    }

    function saveData(photoData) {
        const userObjective = document.getElementById('objective').value.trim();
        const formData = {
            id: Date.now(),
            name: document.getElementById('name').value.trim(),
            address: document.getElementById('address').value.trim(),
            mobile: document.getElementById('mobile').value.trim(),
            email: document.getElementById('email').value.trim(),
            photo: photoData,
            objective: userObjective ? userObjective : DEFAULT_OBJECTIVE,
            education: cleanStringList(document.getElementById('education').value),
            technical: cleanStringList(document.getElementById('technical').value),
            skills: cleanStringList(document.getElementById('skills').value),
            projects: cleanStringList(document.getElementById('projects').value),
            experience: cleanStringList(document.getElementById('experience').value),
            fatherName: document.getElementById('fatherName').value.trim(),
            motherName: document.getElementById('motherName').value.trim(),
            dob: document.getElementById('dob').value.trim() || '13 Sep 2006',
            gender: document.getElementById('gender').value,
            maritalStatus: document.getElementById('maritalStatus').value.trim() || 'un-married',
            religion: document.getElementById('religion').value.trim() || 'Hindu',
            nationality: document.getElementById('nationality').value.trim() || 'Indian',
            languages: document.getElementById('languages').value.trim() || 'Hindi , English .',
            interest: document.getElementById('interest').value.trim() || 'teaching , reading Books, Accounting.'
        };

        let existingData = JSON.parse(localStorage.getItem('resumesList')) || [];
        existingData.push(formData);
        localStorage.setItem('resumesList', JSON.stringify(existingData));
        alert('Resume Data Generated Successfully!');
        window.location.href = 'data.html';
    }
</script>
</body>
</html>
