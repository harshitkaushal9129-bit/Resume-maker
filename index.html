<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<meta name="description" content="Ultra Neon Resume Builder - Pro A4 Resume">
<link rel="manifest" href="manifest.json">
<title>Ultra Neon Resume Builder</title>
<style>
:root{--cyan:#00f6ff;--pink:#ff00d4;--purple:#8b5cf6;--bg:#050816;--panel:rgba(10,15,35,.86);--text:#eafcff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,#102b55 0,transparent 35%),radial-gradient(circle at 90% 20%,#401044 0,transparent 35%),#050816;padding:28px 16px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(0,246,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,212,.025) 1px,transparent 1px);background-size:28px 28px}
.top{max-width:900px;margin:0 auto 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.logo{font-size:22px;font-weight:900;letter-spacing:1px;text-shadow:0 0 12px var(--cyan),0 0 24px var(--pink)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--cyan);color:white;background:linear-gradient(135deg,#09243a,#17113d);padding:11px 16px;border-radius:12px;font-weight:800;cursor:pointer;box-shadow:0 0 10px rgba(0,246,255,.25);text-decoration:none}
.btn:hover{box-shadow:0 0 18px rgba(0,246,255,.55);transform:translateY(-1px)}
.form-container{max-width:900px;margin:auto;background:var(--panel);border:1px solid rgba(0,246,255,.45);border-radius:22px;padding:30px;box-shadow:0 0 25px rgba(0,246,255,.12),0 0 55px rgba(255,0,212,.08);backdrop-filter:blur(14px)}
h2{margin:0 0 24px;text-align:center;font-size:28px;text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 10px var(--cyan)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.full{grid-column:1/-1}
label{display:block;margin:0 0 7px;font-size:13px;font-weight:800;color:#bafaff}
input,textarea,select{width:100%;border:1px solid #244a68;border-radius:11px;background:#071020;color:white;padding:12px;font-size:14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,246,255,.12),0 0 14px rgba(0,246,255,.22)}
textarea{min-height:90px;resize:vertical}
.submit{width:100%;margin-top:22px;padding:15px;border:1px solid var(--cyan);border-radius:13px;background:linear-gradient(90deg,#00a8b3,#7b00ff,#d0009c);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 0 18px rgba(0,246,255,.3)}
.submit:disabled{opacity:0.6;cursor:not-allowed}
.nav{display:block;text-align:center;margin-top:16px;color:#8ffaff;font-weight:800}
.error-text{color:#ff5588;font-size:12px;margin-top:4px;display:none}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">⚡ ULTRA NEON RESUME</div>
  <div class="actions">
    <button class="btn install-btn" id="installBtn" hidden>📲 Install App</button>
    <a class="btn" href="data.html">📄 View Resumes</a>
  </div>
</div>
<div class="form-container">
<h2>Resume Data Input</h2>
<form id="resumeForm">
<div class="form-grid">
<div class="full">
  <label>Full Name *</label>
  <input id="fullName" required placeholder="e.g. Harshit Kaushal">
</div>
<div class="full">
  <label>Address *</label>
  <input id="address" required placeholder="Full residential address">
</div>
<div>
  <label>Mobile No (10-digit) *</label>
  <input id="mobile" type="tel" maxlength="10" required placeholder="9129191898">
  <div class="error-text" id="mobileError">Sahi 10-digit mobile number enter karein.</div>
</div>
<div>
  <label>Gmail Address *</label>
  <input id="email" type="email" required placeholder="username@gmail.com">
  <div class="error-text" id="emailError">Sahi @gmail.com address enter karein.</div>
</div>
<div class="full">
  <label>Profile Photo</label>
  <input id="photoInput" type="file" accept="image/*">
</div>
<div class="full">
  <label>Objective</label>
  <textarea id="objective">To work in a progressive organization where I can put my effort at the level of my best and enhance my skills and knowledge and achieve high career growth through a continuous learning process.</textarea>
</div>
<div class="full">
  <label>Education Qualification (comma separated)</label>
  <textarea id="education" placeholder="10th Passed from UP Board, 12th Passed from UP Board, Graduation from University"></textarea>
</div>
<div class="full">
  <label>Technical Qualification (comma separated)</label>
  <textarea id="technical" placeholder="ADCA (Advance Diploma in Computer Application), O Level, Tally Prime"></textarea>
</div>
<div class="full">
  <label>Key Skills (comma separated)</label>
  <textarea id="skills" placeholder="HTML, CSS, JavaScript, Web Development, Computer Hardware"></textarea>
</div>
<div class="full">
  <label>Projects / Certifications (comma separated)</label>
  <textarea id="projects" placeholder="NIELIT O Level Certification, Resume Builder Web App"></textarea>
</div>
<div class="full">
  <label>Work Experience (comma separated)</label>
  <textarea id="experience" placeholder="1 Year Computer Operator, Fresher"></textarea>
</div>
<div>
  <label>Father's Name</label>
  <input id="fatherName" placeholder="Father's full name">
</div>
<div>
  <label>Mother's Name</label>
  <input id="motherName" placeholder="Mother's full name">
</div>
<div>
  <label>Date of Birth *</label>
  <input id="dob" type="date" required>
</div>
<div>
  <label>Gender</label>
  <select id="gender">
    <option value="Male" selected>Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
  </select>
</div>
<div>
  <label>Marital Status</label>
  <select id="maritalStatus">
    <option value="Unmarried" selected>Unmarried</option>
    <option value="Married">Married</option>
  </select>
</div>
<div>
  <label>Religion</label>
  <input id="religion" value="Hindu">
</div>
<div>
  <label>Nationality</label>
  <input id="nationality" value="Indian">
</div>
<div>
  <label>Languages Known</label>
  <input id="languages" value="Hindi, English">
</div>
<div class="full">
  <label>Interest / Hobbies</label>
  <input id="interest" value="Teaching, Web Designing, Reading Books">
</div>
</div>
<button class="submit" id="submitBtn" type="submit">⚡ SAVE & UPLOAD TO SERVER</button>
</form>
<a class="nav" href="data.html">Open Resume Gallery →</a>
</div>

<!-- Service Worker Registration & PWA Logic -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ Service Worker Registered:', reg.scope))
        .catch(err => console.error('❌ SW Registration Failed:', err));
    });
  }

  let deferredPrompt;
  const installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if(installBtn) installBtn.hidden = false;
  });

  if(installBtn) {
    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.hidden = true;
        }
        deferredPrompt = null;
      }
    });
  }
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBBrVgaXd6R7_URz3FzX5oTA3mcLyFC_Ew",
    authDomain: "resume-38506.firebaseapp.com",
    projectId: "resume-38506",
    storageBucket: "resume-38506.firebasestorage.app",
    messagingSenderId: "979584346197",
    appId: "1:979584346197:web:d3c494981cfaea9e394cdc",
    measurementId: "G-9DQFN3K84S"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const defaultObj = "To work in a progressive organization where I can put my effort at the level of my best and enhance my skills and knowledge and achieve high career growth through a continuous learning process.";

  document.getElementById("resumeForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const mobileErr = document.getElementById("mobileError");
    const emailErr = document.getElementById("emailError");

    const mobileReg = /^[6-9]\d{9}$/;
    const gmailReg = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    let isValid = true;
    if(!mobileReg.test(mobile)) {
      mobileErr.style.display = "block";
      isValid = false;
    } else {
      mobileErr.style.display = "none";
    }

    if(!gmailReg.test(email)) {
      emailErr.style.display = "block";
      isValid = false;
    } else {
      emailErr.style.display = "none";
    }

    if(!isValid) return;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "⏳ Uploading to Server...";

    const fileInput = document.getElementById("photoInput");
    if(fileInput.files && fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = (x) => uploadToFirebase(x.target.result);
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      uploadToFirebase("");
    }
  });

  async function uploadToFirebase(photoBase64) {
    const arr = id => document.getElementById(id).value.split(",").map(x=>x.trim()).filter(Boolean);
    
    let rawDob = document.getElementById("dob").value;
    let formattedDob = rawDob;
    if(rawDob.includes("-")) {
      const [y, m, d] = rawDob.split("-");
      formattedDob = `${d}/${m}/${y}`;
    }

    const payload = {
      name: document.getElementById("fullName").value.trim(),
      address: document.getElementById("address").value.trim(),
      mobile: document.getElementById("mobile").value.trim(),
      email: document.getElementById("email").value.trim(),
      photo: photoBase64,
      objective: document.getElementById("objective").value.trim() || defaultObj,
      education: arr("education"),
      technical: arr("technical"),
      skills: arr("skills"),
      projects: arr("projects"),
      experience: arr("experience"),
      fatherName: document.getElementById("fatherName").value.trim(),
      motherName: document.getElementById("motherName").value.trim(),
      dob: formattedDob,
      gender: document.getElementById("gender").value,
      maritalStatus: document.getElementById("maritalStatus").value,
      religion: document.getElementById("religion").value.trim() || "Hindu",
      nationality: document.getElementById("nationality").value.trim() || "Indian",
      languages: document.getElementById("languages").value.trim() || "Hindi, English",
      interest: document.getElementById("interest").value.trim() || "Teaching, Web Designing",
      createdAt: new Date().toISOString()
    };

    try {
      await addDoc(collection(db, "resumes"), payload);
      alert("✅ Resume Server Par Upload Ho Gaya!");
      window.location.href = "data.html";
    } catch(err) {
      console.error("Firebase Storage Error:", err);
      alert("❌ Server Upload Failed: " + err.message);
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("submitBtn").innerText = "⚡ SAVE & UPLOAD TO SERVER";
    }
  }
</script>
</body>
</html>
