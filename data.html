<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Resumes Vault</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Georgia&family=Merriweather:wght@400;700&family=Cinzel:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- HTML2CANVAS LIBRARY FOR HD IMAGE EXPORT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --bg-dark: #05050d; --card-bg: rgba(13, 13, 26, 0.95); --neon-cyan: #00f3ff; --neon-pink: #ff007f; --neon-purple: #b000ff; --neon-green: #00ff66; --text-main: #f0f6fc; }
        * { box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); background-image: radial-gradient(circle at 80% 20%, rgba(0, 243, 255, 0.12) 0%, transparent 40%), radial-gradient(circle at 20% 80%, rgba(255, 0, 127, 0.12) 0%, transparent 40%); margin: 0; padding: 30px 20px; color: var(--text-main); min-height: 100vh; }
        
        .top-bar { max-width: 1000px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple)); color: white; text-decoration: none; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 700; border: none; cursor: pointer; font-size: 12px; transition: all 0.3s; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); text-transform: uppercase; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255, 0, 127, 0.8); }
        .btn-share { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        .btn-edit { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #ff0055, #990033); box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }
        .btn-print { background: linear-gradient(135deg, #00c8ff, #0055ff); }
        .btn-docx { background: linear-gradient(135deg, var(--neon-green), #009933); color: #000; }
        .btn-img { background: linear-gradient(135deg, #a855f7, #6b21a8); }
        .btn-close { background: #334155; }
        
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 25px; max-width: 1000px; margin: 0 auto; }
        .user-card { background: var(--card-bg); border-radius: 16px; padding: 22px; text-align: center; border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); cursor: pointer; transition: all 0.3s ease; position: relative; backdrop-filter: blur(10px); }
        .user-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--neon-pink); box-shadow: 0 0 25px rgba(255, 0, 127, 0.5); }
        .user-card-img { width: 105px; height: 125px; object-fit: cover; border-radius: 8px; border: 2px solid var(--neon-cyan); margin: 0 auto 14px auto; display: block; box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .user-card-name { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 6px; text-shadow: 0 0 5px var(--neon-cyan); }
        .user-card-sub { font-size: 14px; color: var(--neon-pink); margin-bottom: 14px; }
        .delete-btn-icon { position: absolute; top: 12px; right: 12px; background: rgba(255, 0, 85, 0.2); color: #ff0055; border: 1px solid #ff0055; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .delete-btn-icon:hover { background: #ff0055; color: #fff; box-shadow: 0 0 10px #ff0055; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 13, 0.85); backdrop-filter: blur(8px); z-index: 999; overflow-y: auto; padding: 20px 0; }
        .modal-action-bar { width: 210mm; margin: 0 auto 15px auto; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); flex-wrap: wrap; gap: 8px; }
        .layout-selector { display: flex; align-items: center; gap: 10px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--neon-cyan); }
        .layout-selector select { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--neon-pink); background: #05050d; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700; cursor: pointer; }
        
        .edit-modal-box { width: 90%; max-width: 850px; background: var(--card-bg); border: 1px solid var(--neon-cyan); border-radius: 16px; margin: 30px auto; padding: 25px; box-shadow: 0 0 30px rgba(0,243,255,0.4); }
        .edit-form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 15px; margin-top: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: var(--neon-cyan); font-weight: bold; }
        .form-group input, .form-group textarea { padding: 10px; border-radius: 6px; border: 1px solid rgba(0, 243, 255, 0.3); background: #080814; color: #fff; font-family: 'Rajdhani', sans-serif; }
        .form-group textarea { resize: vertical; min-height: 70px; }
        
        .resume-card { width: 210mm; min-height: 297mm; background: #ffffff; padding: 45px 50px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,243,255,0.3); box-sizing: border-box; color: #111; position: relative; }
        .resume-top-banner { text-align: center; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; margin-bottom: 15px; font-size: 22px; line-height: 1; }

        .photo-box { width: 105px; height: 125px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fafafa; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .objective-text { font-size: 13.5px; line-height: 1.5; margin-top: 6px; text-align: justify; }
        ul.resume-ul { margin: 6px 0 10px 0; padding-left: 20px; }
        ul.resume-ul li { margin-bottom: 4px; font-size: 13.5px; line-height: 1.4; }
        .details-table { width: 100%; font-size: 13.5px; margin-top: 8px; border-collapse: collapse; }
        .details-table td { padding: 4px 0; vertical-align: top; line-height: 1.4; }
        .details-table td:first-child { width: 180px; font-weight: bold; }
        
        /* LAYOUT STYLES */
        .layout-classic { font-family: 'Georgia', serif; }
        .layout-classic .resume-top-banner { border-bottom: 2px dashed #333; padding-bottom: 8px; color: #111; }
        .layout-classic .resume-title { text-align: left; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; color: #000; }
        .layout-classic .header-section { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 15px; }
        .layout-classic .header-info { width: 78%; font-size: 14px; line-height: 1.6; }
        .layout-classic .header-info p { margin: 3px 0; }
        .layout-classic .section-title { font-size: 15px; font-weight: bold; text-transform: uppercase; margin-top: 18px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 3px; letter-spacing: 0.5px; }
        
        .layout-modern { font-family: 'Rajdhani', sans-serif; color: #0f172a; }
        .layout-modern .resume-top-banner { background: #0284c7; color: white; padding: 6px; margin: -45px -50px 20px -50px; font-family: 'Orbitron', sans-serif; }
        .layout-modern .resume-title { font-size: 28px; font-weight: 700; color: #0284c7; text-transform: uppercase; margin-bottom: 5px; }
        .layout-modern .header-section { display: flex; justify-content: space-between; border-bottom: 3px solid #0284c7; padding-bottom: 15px; margin-bottom: 20px; }
        .layout-modern .header-info p { margin: 3px 0; font-size: 14px; }
        .layout-modern .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; color: #0284c7; background: #f0f9ff; padding: 6px 10px; border-radius: 4px; margin-top: 18px; margin-bottom: 10px; }
        
        .layout-darkaccent { font-family: 'Rajdhani', sans-serif; color: #0f172a; }
        .layout-darkaccent .resume-top-banner { display: none; }
        .layout-darkaccent .header-section { background: #0f172a; color: #fff; padding: 25px; margin: -45px -50px 25px -50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #38bdf8; }
        .layout-darkaccent .resume-title { font-size: 26px; font-weight: 700; color: #38bdf8; text-transform: uppercase; }
        .layout-darkaccent .header-info p { margin: 3px 0; font-size: 14px; }
        .layout-darkaccent .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; color: #0f172a; border-left: 4px solid #0284c7; padding-left: 10px; margin-top: 20px; margin-bottom: 10px; }
        
        .layout-emerald { font-family: 'Merriweather', serif; color: #1e293b; }
        .layout-emerald .resume-top-banner { color: #047857; letter-spacing: 8px; border-bottom: 1px solid #047857; padding-bottom: 4px; }
        .layout-emerald .resume-title { font-size: 27px; font-weight: 700; color: #047857; margin-bottom: 8px; }
        .layout-emerald .header-section { display: flex; justify-content: space-between; border-bottom: 2px dashed #047857; padding-bottom: 15px; margin-bottom: 20px; }
        .layout-emerald .header-info p { margin: 3px 0; font-size: 13.5px; }
        .layout-emerald .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; color: #047857; border-bottom: 1px solid #a7f3d0; padding-bottom: 4px; margin-top: 18px; margin-bottom: 8px; }
        
        .layout-minimal { font-family: 'Roboto', sans-serif; color: #334155; }
        .layout-minimal .resume-top-banner { color: #64748b; font-size: 18px; text-align: left; letter-spacing: 4px; margin-bottom: 5px; }
        .layout-minimal .resume-title { font-size: 26px; font-weight: 700; color: #0f172a; letter-spacing: 1px; }
        .layout-minimal .header-section { display: flex; justify-content: space-between; border-bottom: 1px solid #cbd5e1; padding-bottom: 12px; margin-bottom: 18px; }
        .layout-minimal .header-info p { margin: 2px 0; font-size: 13.5px; }
        .layout-minimal .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #475569; letter-spacing: 1px; margin-top: 16px; margin-bottom: 6px; }
        
        .layout-crimson { font-family: 'Georgia', serif; color: #27272a; }
        .layout-crimson .resume-top-banner { color: #991b1b; text-align: center; }
        .layout-crimson .resume-title { font-size: 28px; font-weight: 700; color: #991b1b; text-transform: uppercase; border-bottom: 3px double #991b1b; padding-bottom: 6px; margin-bottom: 15px; }
        .layout-crimson .header-section { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .layout-crimson .header-info p { margin: 3px 0; font-size: 14px; }
        .layout-crimson .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; color: #991b1b; border-bottom: 1px solid #fca5a5; padding-bottom: 3px; margin-top: 18px; margin-bottom: 8px; }
        
        .layout-golden { font-family: 'Cinzel', serif; color: #1c1917; }
        .layout-golden .resume-top-banner { color: #854d0e; letter-spacing: 10px; }
        .layout-golden .resume-title { font-size: 26px; font-weight: 700; color: #854d0e; text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        .layout-golden .header-section { display: flex; justify-content: space-between; border-top: 2px solid #ca8a04; border-bottom: 2px solid #ca8a04; padding: 12px 0; margin: 15px 0 20px 0; }
        .layout-golden .header-info p { margin: 3px 0; font-size: 13.5px; font-family: 'Georgia', serif; }
        .layout-golden .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #854d0e; border-bottom: 1px solid #fef08a; padding-bottom: 3px; margin-top: 18px; margin-bottom: 8px; letter-spacing: 1px; }
        
        .layout-indigo { font-family: 'Rajdhani', sans-serif; color: #1e1b4b; }
        .layout-indigo .resume-top-banner { color: #3730a3; letter-spacing: 5px; }
        .layout-indigo .resume-title { font-size: 28px; font-weight: 700; color: #3730a3; text-transform: uppercase; }
        .layout-indigo .header-section { display: flex; justify-content: space-between; background: #e0e7ff; padding: 18px; border-radius: 8px; margin-bottom: 20px; }
        .layout-indigo .header-info p { margin: 3px 0; font-size: 14px; }
        .layout-indigo .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; color: #3730a3; border-bottom: 2px solid #6366f1; padding-bottom: 4px; margin-top: 18px; margin-bottom: 8px; }
        
        .layout-slate { font-family: 'Roboto', sans-serif; color: #0f172a; }
        .layout-slate .resume-top-banner { background: #334155; color: #fff; padding: 4px 10px; width: fit-content; font-size: 14px; }
        .layout-slate .resume-title { font-size: 26px; font-weight: 700; color: #334155; border-left: 6px solid #475569; padding-left: 12px; margin-bottom: 15px; }
        .layout-slate .header-section { display: flex; justify-content: space-between; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .layout-slate .header-info p { margin: 3px 0; font-size: 13.5px; }
        .layout-slate .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: #334155; background: #f1f5f9; padding: 5px 8px; margin-top: 18px; margin-bottom: 8px; }
        
        .layout-coral { font-family: 'Rajdhani', sans-serif; color: #27272a; }
        .layout-coral .resume-top-banner { color: #e11d48; text-align: left; }
        .layout-coral .resume-title { font-size: 28px; font-weight: 700; color: #e11d48; text-transform: uppercase; }
        .layout-coral .header-section { display: flex; justify-content: space-between; border-bottom: 3px solid #f43f5e; padding-bottom: 12px; margin-bottom: 20px; }
        .layout-coral .header-info p { margin: 3px 0; font-size: 14px; }
        .layout-coral .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; color: #e11d48; border-bottom: 1px dashed #fda4af; padding-bottom: 3px; margin-top: 18px; margin-bottom: 8px; }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
            .top-bar, .users-grid, .modal-action-bar, .edit-modal-box { display: none !important; }
            .modal-overlay { position: static !important; background: none !important; padding: 0 !important; display: block !important; }
            .resume-card { box-shadow: none !important; margin: 0 !important; width: 100% !important; border: none !important; }
        }
    </style>
</head>
<body>
<div class="top-bar">
    <a href="index.html" class="btn">+ Create New Resume</a>
    <button onclick="shareApp()" class="btn btn-share">🔗 Share Vault</button>
    <button onclick="clearAllData()" class="btn btn-danger">Clear Vault Data</button>
</div>

<div class="users-grid" id="usersGrid"></div>

<!-- RESUME DISPLAY MODAL -->
<div class="modal-overlay" id="resumeModal">
    <div class="modal-action-bar">
        <div class="layout-selector">
            <span>Layout Style:</span>
            <select id="layoutSelect" onchange="renderResumeModal()">
                <option value="classic">1. Classic Executive</option>
                <option value="modern">2. Modern Cyber Blue</option>
                <option value="darkaccent">3. Dark Header Premium</option>
                <option value="emerald">4. Elegant Emerald</option>
                <option value="minimal">5. Minimalist Charcoal</option>
                <option value="crimson">6. Crimson Royal</option>
                <option value="golden">7. Golden Luxury</option>
                <option value="indigo">8. Tech Indigo</option>
                <option value="slate">9. Clean Slate</option>
                <option value="coral">10. Coral Creative</option>
            </select>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button class="btn btn-edit" onclick="openEditForm()">✏️ Edit</button>
            <button class="btn btn-img" onclick="exportAsImage('png')">🖼️ PNG (HD)</button>
            <button class="btn btn-img" onclick="exportAsImage('jpeg')">🖼️ JPG (HD)</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ PDF</button>
            <button class="btn btn-docx" onclick="downloadDocx()">📄 .DOCX</button>
            <button class="btn btn-close" onclick="closeModal()">✖</button>
        </div>
    </div>
    <div id="modalResumeContent"></div>
</div>

<!-- EDIT RESUME MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="edit-modal-box">
        <h2 style="font-family: Orbitron; color: var(--neon-cyan); margin-top:0;">✏️ EDIT RESUME & PHOTO</h2>
        <div class="edit-form-grid" id="editFormContainer"></div>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-docx" onclick="saveResumeEdit()">💾 Save Changes</button>
            <button class="btn btn-close" onclick="closeEditModal()">Close</button>
        </div>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.error('SW Registration Failed:', err));
        });
    }
</script>

<script>
    let activeIndex = null;
    let tempPhotoBase64 = null;
    const DEFAULT_OBJECTIVE = "To work in a progressive organization where I can put my effort at the level of my best and enhance my skills and knowledge and achieve high career growth through a continuous learning process and looking for a dynamic and vibrant work.";

    function shareApp() {
        const shareData = {
            title: 'Neon Resumes Vault',
            text: 'Apna professional resume aasaani se banayein aur manage karein Neon Resumes Vault se!',
            url: window.location.href
        };
        if (navigator.share) {
            navigator.share(shareData).catch(err => console.log('Share error:', err));
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('App Link Clipboard par copy ho gaya hai!');
            }).catch(() => {
                alert('Link copy nahi ho paya, kripya URL bar se copy karein.');
            });
        }
    }

    function renderListItems(strData) {
        if (!strData) return '';
        let items = strData.split('.').map(item => item.trim()).filter(Boolean);
        return items.map(item => `<li>${item}.</li>`).join('');
    }

    function renderUserGrid() {
        const grid = document.getElementById('usersGrid');
        const resumes = JSON.parse(localStorage.getItem('resumesList')) || [];
        if (resumes.length === 0) {
            grid.innerHTML = '<h3 style="grid-column: 1/-1; text-align:center; color:var(--neon-pink); font-family:Orbitron;">NO RESUME DATA FOUND. PLEASE ADD DATA IN <a href="index.html" style="color:var(--neon-cyan);">INDEX.HTML</a></h3>';
            return;
        }
        grid.innerHTML = '';
        resumes.forEach((data, index) => {
            const userCard = document.createElement('div');
            userCard.className = 'user-card';
            const photoSrc = data.photo || 'https://via.placeholder.com/100x120?text=NO+PHOTO';
            userCard.innerHTML = `
                <button class="delete-btn-icon" title="Delete Resume" onclick="deleteResume(event, ${index})">✕</button>
                <img src="${photoSrc}" class="user-card-img" alt="User Image">
                <div class="user-card-name">${data.name || 'Unnamed User'}</div>
                <div class="user-card-sub">${data.mobile || 'No Mobile'}</div>
                <span style="font-size: 13px; color: var(--neon-cyan); font-weight: 700;">LAUNCH RESUME 📄</span>
            `;
            userCard.onclick = (e) => {
                if(!e.target.classList.contains('delete-btn-icon')) { openResumeModal(index); }
            };
            grid.appendChild(userCard);
        });
    }

    function openResumeModal(index) {
        activeIndex = index;
        document.getElementById('resumeModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
        renderResumeModal();
    }

    function renderResumeModal() {
        const resumes = JSON.parse(localStorage.getItem('resumesList')) || [];
        const data = resumes[activeIndex];
        if (!data) return;

        const selectedLayout = document.getElementById('layoutSelect').value;
        const modalContent = document.getElementById('modalResumeContent');
        const photoHtml = data.photo ? `<img src="${data.photo}" alt="Photo">` : `<span style="font-size:10px; color:#777; text-align:center;">PASSPORT PHOTO</span>`;
        
        const educationList = renderListItems(data.education);
        const technicalList = renderListItems(data.technical);
        const skillsList = renderListItems(data.skills);
        const projectsList = renderListItems(data.projects);
        const experienceList = renderListItems(data.experience);
        const finalObjective = (data.objective && data.objective.trim() !== '') ? data.objective : DEFAULT_OBJECTIVE;

        modalContent.innerHTML = `
            <div class="resume-card layout-${selectedLayout}" id="printableResume">
                <div class="resume-top-banner">R E S U M E</div>
                
                <div class="header-section">
                    <div class="header-info">
                        <div class="resume-title">${data.name || 'RESUME'}</div>
                        <p><strong>Address :</strong> ${data.address || ''}</p>
                        <p><strong>Mobile No :</strong> ${data.mobile || ''}</p>
                        ${data.email ? `<p><strong>Email ID :</strong> ${data.email}</p>` : ''}
                    </div>
                    <div class="photo-box">${photoHtml}</div>
                </div>

                <div class="section-title">Objective :-</div>
                <div class="objective-text">${finalObjective}</div>

                ${educationList ? `<div class="section-title">Education Qualification :-</div><ul class="resume-ul">${educationList}</ul>` : ''}
                ${technicalList ? `<div class="section-title">Technical Qualification :-</div><ul class="resume-ul">${technicalList}</ul>` : ''}
                ${skillsList ? `<div class="section-title">Key Skills & Capabilities :-</div><ul class="resume-ul">${skillsList}</ul>` : ''}
                ${projectsList ? `<div class="section-title">Projects / Certifications :-</div><ul class="resume-ul">${projectsList}</ul>` : ''}
                ${experienceList ? `<div class="section-title">Work Experience :-</div><ul class="resume-ul">${experienceList}</ul>` : ''}

                <div class="section-title">Personal Details :-</div>
                <table class="details-table">
                    <tr><td>Father’s Name :-</td><td>${data.fatherName || ''}</td></tr>
                    <tr><td>Mother’s Name :-</td><td>${data.motherName || ''}</td></tr>
                    <tr><td>Date of Birth / Born :-</td><td>${data.dob || ''}</td></tr>
                    <tr><td>Gender :-</td><td>${data.gender || 'Male'}</td></tr>
                    <tr><td>Marital Status :-</td><td>${data.maritalStatus || 'un-married'}</td></tr>
                    <tr><td>Religion :-</td><td>${data.religion || 'Hindu'}</td></tr>
                    <tr><td>Nationality :-</td><td>${data.nationality || 'Indian'}</td></tr>
                    <tr><td>Language Known :-</td><td>${data.languages || 'Hindi , English .'}</td></tr>
                    <tr><td>Interest :-</td><td>${data.interest || ''}</td></tr>
                </table>
            </div>
        `;
    }

    /* EDIT & PHOTO UPLOAD FUNCTIONS */
    function openEditForm() {
        const resumes = JSON.parse(localStorage.getItem('resumesList')) || [];
        const data = resumes[activeIndex];
        if (!data) return;

        tempPhotoBase64 = data.photo || null;
        const container = document.getElementById('editFormContainer');
        
        const fields = [
            { key: 'name', label: 'Full Name', type: 'input' },
            { key: 'mobile', label: 'Mobile Number', type: 'input' },
            { key: 'email', label: 'Email ID', type: 'input' },
            { key: 'address', label: 'Address', type: 'textarea' },
            { key: 'objective', label: 'Career Objective', type: 'textarea' },
            { key: 'education', label: 'Education (period separated .)', type: 'textarea' },
            { key: 'technical', label: 'Technical Qualification', type: 'textarea' },
            { key: 'skills', label: 'Key Skills', type: 'textarea' },
            { key: 'projects', label: 'Projects / Certifications', type: 'textarea' },
            { key: 'experience', label: 'Work Experience', type: 'textarea' },
            { key: 'fatherName', label: "Father's Name", type: 'input' },
            { key: 'motherName', label: "Mother's Name", type: 'input' },
            { key: 'dob', label: 'Date of Birth', type: 'input' },
            { key: 'languages', label: 'Languages Known', type: 'input' },
            { key: 'interest', label: 'Interests', type: 'input' }
        ];

        let html = `
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Profile Photo / Image :-</label>
                <input type="file" id="edit_photo_file" accept="image/*" onchange="handleImageChange(event)">
            </div>
        `;

        html += fields.map(f => `
            <div class="form-group">
                <label>${f.label}</label>
                ${f.type === 'textarea' 
                    ? `<textarea id="edit_${f.key}">${data[f.key] || ''}</textarea>` 
                    : `<input type="text" id="edit_${f.key}" value="${data[f.key] || ''}">`}
            </div>
        `).join('');

        container.innerHTML = html;
        document.getElementById('editModal').style.display = 'block';
    }

    function handleImageChange(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempPhotoBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    function saveResumeEdit() {
        let resumes = JSON.parse(localStorage.getItem('resumesList')) || [];
        if (activeIndex === null || !resumes[activeIndex]) return;

        const keys = ['name', 'mobile', 'email', 'address', 'objective', 'education', 'technical', 'skills', 'projects', 'experience', 'fatherName', 'motherName', 'dob', 'languages', 'interest'];
        
        keys.forEach(key => {
            const elem = document.getElementById(`edit_${key}`);
            if (elem) {
                resumes[activeIndex][key] = elem.value;
            }
        });

        if (tempPhotoBase64) {
            resumes[activeIndex].photo = tempPhotoBase64;
        }

        localStorage.setItem('resumesList', JSON.stringify(resumes));
        closeEditModal();
        renderUserGrid();
        renderResumeModal();
    }

    /* HD IMAGE EXPORT FUNCTION (.PNG / .JPG) */
    function exportAsImage(format) {
        const element = document.getElementById('printableResume');
        if (!element) return;

        const opt = {
            scale: 3, // High DPI for crisp HD quality
            useCORS: true,
            logging: false,
            backgroundColor: '#ffffff'
        };

        html2canvas(element, opt).then(canvas => {
            const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
            const imgData = canvas.toDataURL(mimeType, 1.0);
            
            const downloadLink = document.createElement('a');
            downloadLink.href = imgData;
            downloadLink.download = `Resume_HD.${format}`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }).catch(err => {
            console.error('Image Export Failed:', err);
            alert('Image generate hone mein samasya aayi. Kripya punah prayas karein.');
        });
    }

    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
    function closeModal() { document.getElementById('resumeModal').style.display = 'none'; document.body.style.overflow = 'auto'; }

    function deleteResume(event, index) {
        event.stopPropagation();
        if (confirm("Kya aap is user ka resume delete karna chahte hain?")) {
            let resumes = JSON.parse(localStorage.getItem('resumesList')) || [];
            resumes.splice(index, 1);
            localStorage.setItem('resumesList', JSON.stringify(resumes));
            renderUserGrid();
        }
    }

    function clearAllData() {
        if (confirm("Kya aap saara data delete karna chahte hain?")) {
            localStorage.removeItem('resumesList');
            renderUserGrid();
        }
    }

    function downloadDocx() {
        const content = document.getElementById('printableResume').innerHTML;
        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Resume</title></head><body>";
        const footer = "</body></html>";
        const sourceHTML = header + content + footer;

        const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        const fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = source;
        fileDownload.download = 'Resume.doc';
        fileDownload.click();
        document.body.removeChild(fileDownload);
    }

    window.onload = renderUserGrid;
</script>
</body>
</html>
